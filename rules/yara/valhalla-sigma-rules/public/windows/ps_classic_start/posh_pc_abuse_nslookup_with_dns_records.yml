title: Nslookup PowerShell Download Cradle
id: 999bff6d-dc15-44c9-9f5c-e1051bfc86e1
related:
    - type: similar
      id: 1b3b01c7-84e9-4072-86e5-fc285a41ff23
status: test
description: Detects a powershell download cradle using nslookup. This cradle uses nslookup to extract payloads from DNS records.
references:
    - https://twitter.com/Alh4zr3d/status/1566489367232651264
date: "2022-12-10"
modified: "2025-02-25"
author: Sai Prashanth Pulisetti @pulisettis, Aishwarya Singam
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: ps_classic_start
    product: windows
detection:
    condition: selection
    selection:
        Data|contains:
            - -q=txt http
            - -querytype=txt http
            - -type=txt http
        Data|contains|all:
            - powershell
            - nslookup
            - '[1]'
falsepositives:
    - Unknown
level: medium
tags:
    - attack.execution
    - attack.t1059.001
customer: 'demo'
