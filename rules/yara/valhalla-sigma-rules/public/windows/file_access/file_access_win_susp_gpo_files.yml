title: Access To Potentially Sensitive Sysvol Files By Uncommon Applications
id: d51694fe-484a-46ac-92d6-969e76d60d10
related:
    - type: derived
      id: 8344c19f-a023-45ff-ad63-a01c5396aea0
status: test
description: Detects file access requests to potentially sensitive files hosted on the Windows Sysvol share.
references:
    - https://github.com/vletoux/pingcastle
date: "2023-12-21"
modified: "2024-07-29"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: file_access
    product: windows
    definition: 'Requirements: Microsoft-Windows-Kernel-File ETW provider'
detection:
    condition: selection and not 1 of filter_main_*
    filter_main_explorer:
        Image: C:\Windows\explorer.exe
    filter_main_generic:
        Image|startswith:
            - C:\Program Files (x86)\
            - C:\Program Files\
            - C:\Windows\system32\
            - C:\Windows\SysWOW64\
    selection:
        FileName|contains|all:
            - \sysvol\
            - \Policies\
        FileName|endswith:
            - audit.csv
            - Files.xml
            - GptTmpl.inf
            - groups.xml
            - Registry.pol
            - Registry.xml
            - scheduledtasks.xml
            - scripts.ini
            - services.xml
        FileName|startswith: \\
falsepositives:
    - Unknown
level: medium
tags:
    - attack.credential-access
    - attack.t1552.006
customer: 'demo'
