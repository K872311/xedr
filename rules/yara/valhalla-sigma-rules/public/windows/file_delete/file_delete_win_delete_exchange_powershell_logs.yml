title: Exchange PowerShell Cmdlet History Deleted
id: a55349d8-9588-4c5a-8e3b-1925fe2a4ffe
status: test
description: Detects the deletion of the Exchange PowerShell cmdlet History logs which may indicate an attempt to destroy forensic evidence
references:
    - https://web.archive.org/web/20221012062917/https://m365internals.com/2022/10/07/hunting-in-on-premises-exchange-server-logs/
    - https://www.it-server-room.com/en/exchange-server-log-file-locations-and-cleanup-guide/
date: "2022-10-26"
modified: "2026-10-13"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: file_delete
    product: windows
detection:
    condition: selection
    selection:
        TargetFilename|contains|all:
            - \Logging\CmdletInfra\LocalPowerShell\Cmdlet\
            - _Cmdlet_
falsepositives:
    - Possible FP during log rotation
level: high
tags:
    - attack.stealth
    - attack.t1070
customer: 'demo'
