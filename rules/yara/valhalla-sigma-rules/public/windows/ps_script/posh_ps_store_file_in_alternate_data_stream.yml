title: Powershell Store File In Alternate Data Stream
id: a699b30e-d010-46c8-bbd1-ee2e26765fe9
status: test
description: Storing files in Alternate Data Stream (ADS) similar to Astaroth malware.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1564.004/T1564.004.md
date: "2021-09-02"
modified: "2022-12-25"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: ps_script
    product: windows
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    condition: selection_compspec
    selection_compspec:
        ScriptBlockText|contains|all:
            - Start-Process
            - '-FilePath "$env:comspec" '
            - '-ArgumentList '
            - '>'
falsepositives:
    - Unknown
level: medium
tags:
    - attack.stealth
    - attack.t1564.004
customer: 'demo'
regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_store_file_in_alternate_data_stream/info.yml
