detection:
    condition: selection
    selection:
        ScriptBlockText|contains|all:
            - IO.Compression.DeflateStream
            - IO.MemoryStream
            - ::FromBase64String
            - GetDelegateForFunctionPointer
            - .Invoke()
            - GlobalAssemblyCache
