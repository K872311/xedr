title: Code Executed Via Office Add-in XLL File
id: 36fbec91-fa1b-4d5d-8df1-8d8edcb632ad
status: test
description: |
    Adversaries may abuse Microsoft Office add-ins to obtain persistence on a compromised system.
    Office add-ins can be used to add functionality to Office programs
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1137.006/T1137.006.md
date: "2021-12-28"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: ps_script
    product: windows
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    condition: selection
    selection:
        ScriptBlockText|contains|all:
            - 'new-object '
            - '-ComObject '
            - .application
            - .RegisterXLL
falsepositives:
    - Unknown
level: high
tags:
    - attack.persistence
    - attack.t1137.006
customer: 'demo'
regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_office_comobject_registerxll/info.yml
