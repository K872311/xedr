title: Suspicious IO.FileStream
id: 70ad982f-67c8-40e0-a955-b920c2fa05cb
status: test
description: Open a handle on the drive volume via the \\.\ DOS device path specifier and perform direct access read of the first few bytes of the volume.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1006/T1006.md
date: "2022-01-09"
modified: "2022-03-05"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: ps_script
    product: windows
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    condition: selection
    selection:
        ScriptBlockText|contains|all:
            - New-Object
            - IO.FileStream
            - \\\\.\\
falsepositives:
    - Legitimate PowerShell scripts
level: medium
tags:
    - attack.stealth
    - attack.t1070.003
customer: 'demo'
regression_tests_path: regression_data/rules/windows/powershell/powershell_script/posh_ps_susp_iofilestream/info.yml
