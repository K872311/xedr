title: A Rule Has Been Deleted From The Windows Firewall Exception List
id: c187c075-bb3e-4c62-b4fa-beae0ffc211f
status: test
description: Detects when a single rules or all of the rules have been deleted from the Windows Defender Firewall
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2008-r2-and-2008/dd364427(v=ws.10)
date: "2022-02-19"
modified: "2026-10-19"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    product: windows
    service: firewall-as
detection:
    condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    filter_main_empty:
        ModifyingApplication: ""
    filter_main_generic:
        ModifyingApplication|startswith:
            - C:\Program Files (x86)\
            - C:\Program Files\
            - C:\Windows\WinSxS\
    filter_main_local_system:
        ModifyingUser: S-1-5-18
    filter_main_msiexec:
        ModifyingApplication:
            - C:\Windows\SysWOW64\msiexec.exe
            - C:\Windows\System32\msiexec.exe
    filter_main_msmpeng:
        ModifyingApplication|endswith: \MsMpEng.exe
        ModifyingApplication|startswith: C:\ProgramData\Microsoft\Windows Defender\Platform\
    filter_main_null:
        ModifyingApplication: []
    filter_main_svchost:
        ModifyingApplication: C:\Windows\System32\svchost.exe
    filter_optional_google_updater:
        ModifyingApplication|contains: GoogleUpdater
        ModifyingApplication|endswith: \setup.exe
        ModifyingApplication|startswith: C:\Windows\SystemTemp\
    selection:
        EventID:
            - "2006"
            - "2052"
level: medium
tags:
    - attack.defense-impairment
    - attack.t1686.003
customer: 'demo'
