title: Potential Persistence Via GlobalFlags
id: 36803969-5421-41ec-b92f-8500f79c23b0
related:
    - type: obsolete
      id: c81fe886-cac0-4913-a511-2822d72ff505
status: test
description: Detects registry persistence technique using the GlobalFlags and SilentProcessExit keys
references:
    - https://oddvar.moe/2018/04/10/persistence-using-globalflags-in-image-file-execution-options-hidden-from-autoruns-exe/
    - https://www.deepinstinct.com/2021/02/16/lsass-memory-dumps-are-stealthier-than-ever-before-part-2/
date: "2018-04-11"
modified: "2023-06-05"
author: Karneades, Jonhnathan Ribeiro, Florian Roth
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: registry_set
    product: windows
detection:
    condition: 1 of selection_*
    selection_global_flag:
        TargetObject|contains|all:
            - \Microsoft\Windows NT\CurrentVersion\
            - \Image File Execution Options\
            - \GlobalFlag
    selection_silent_process:
        TargetObject|contains:
            - \ReportingMode
            - \MonitorProcess
        TargetObject|contains|all:
            - \Microsoft\Windows NT\CurrentVersion\
            - \SilentProcessExit\
falsepositives:
    - Unknown
level: high
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1546.012
    - car.2013-01-002
customer: 'demo'
regression_tests_path: regression_data/rules/windows/registry/registry_set/registry_set_persistence_globalflags/info.yml
