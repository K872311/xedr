title: Session Manager Autorun Keys Modification
id: 046218bd-e0d8-4113-a3c3-895a12b2b298
related:
    - type: obsolete
      id: 17f878b8-9968-4578-b814-c4217fc5768c
status: test
description: Detects modification of autostart extensibility point (ASEP) in registry.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1547.001/T1547.001.md
    - https://learn.microsoft.com/en-us/sysinternals/downloads/autoruns
    - https://gist.github.com/GlebSukhodolskiy/0fc5fa5f482903064b448890db1eaf9d
date: "2019-10-25"
modified: "2023-08-17"
author: Victor Sergeev, Daniil Yugoslavskiy, Gleb Sukhodolskiy, Timur Zinniatullin, oscd.community, Tim Shelton, frack113 (split)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: registry_set
    product: windows
detection:
    condition: session_manager_base and session_manager and not filter
    filter:
        Details: (Empty)
    session_manager:
        TargetObject|contains:
            - \SetupExecute
            - \S0InitialCommand
            - \KnownDlls
            - \Execute
            - \BootExecute
            - \AppCertDlls
    session_manager_base:
        TargetObject|contains: \System\CurrentControlSet\Control\Session Manager
falsepositives:
    - Legitimate software automatically (mostly, during installation) sets up autorun keys for legitimate reason
    - Legitimate administrator sets up autorun keys for legitimate reason
level: medium
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.t1547.001
    - attack.t1546.009
customer: 'demo'
simulation:
    - atomic_guid: befc2b40-d487-4a5a-8813-c11085fb5672
      name: Modify BootExecute Value
      technique: T1547.001
      type: atomic-red-team
