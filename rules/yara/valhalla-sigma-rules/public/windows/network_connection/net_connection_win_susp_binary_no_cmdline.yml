title: Suspicious Network Connection Binary No CommandLine
id: 20384606-a124-4fec-acbb-8bd373728613
status: test
description: Detects suspicious network connections made by a well-known Windows binary run with no command line parameters
references:
    - https://redcanary.com/blog/raspberry-robin/
date: "2022-07-03"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: network_connection
    product: windows
detection:
    condition: selection and not 1 of filter*
    filter_no_cmdline:
        CommandLine: ""
    filter_null:
        CommandLine: []
    selection:
        CommandLine|endswith:
            - \regsvr32.exe
            - \rundll32.exe
            - \dllhost.exe
        Image|endswith:
            - \regsvr32.exe
            - \rundll32.exe
            - \dllhost.exe
        Initiated: "true"
falsepositives:
    - Unknown
level: high
tags:
    - attack.stealth
customer: 'demo'
