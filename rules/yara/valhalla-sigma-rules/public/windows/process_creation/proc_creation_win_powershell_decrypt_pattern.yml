title: PowerShell Execution With Potential Decryption Capabilities
id: 434c08ba-8406-4d15-8b24-782cb071a691
status: test
description: Detects PowerShell commands that decrypt an ".LNK" "file to drop the next stage of the malware.
references:
    - https://research.checkpoint.com/2023/chinese-threat-actors-targeting-europe-in-smugx-campaign/
date: "2023-06-30"
modified: "2023-12-05"
author: X__Junior (Nextron Systems), Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_cli_dir:
        CommandLine|contains:
            - 'Get-ChildItem '
            - 'dir '
            - 'gci '
            - 'ls '
    selection_cli_gc:
        CommandLine|contains:
            - 'Get-Content '
            - 'gc '
            - 'cat '
            - 'type '
            - ReadAllBytes
    selection_cli_specific:
        - CommandLine|contains|all:
            - ' ^| '
            - \*.lnk
            - -Recurse
            - '-Skip '
        - CommandLine|contains|all:
            - ' -ExpandProperty '
            - \*.lnk
            - WriteAllBytes
            - ' .length '
    selection_img:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        OriginalFileName:
            - PowerShell.EXE
            - pwsh.dll
falsepositives:
    - Unlikely
level: high
tags:
    - attack.execution
customer: 'demo'
