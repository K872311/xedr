title: Potential Persistence Attempt Via Existing Service Tampering
id: 38879043-7e1e-47a9-8d46-6bec88e201df
status: test
description: Detects the modification of an existing service in order to execute an arbitrary payload when the service is started or killed as a potential method for persistence.
references:
    - https://pentestlab.blog/2020/01/22/persistence-modify-existing-service/
date: "2020-09-29"
modified: "2023-02-04"
author: Sreeman
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection_sc or all of selection_reg_*
    selection_reg_ext:
        CommandLine|contains:
            - .sh
            - .exe
            - .dll
            - .bin$
            - .bat
            - .cmd
            - .js
            - .msh$
            - .reg$
            - .scr
            - .ps
            - .vb
            - .jar
            - .pl
    selection_reg_img:
        - CommandLine|contains|all:
            - 'reg '
            - 'add '
            - FailureCommand
        - CommandLine|contains|all:
            - 'reg '
            - 'add '
            - ImagePath
    selection_sc:
        - CommandLine|contains|all:
            - 'sc '
            - 'config '
            - binpath=
        - CommandLine|contains|all:
            - 'sc '
            - failure
            - command=
falsepositives:
    - Unknown
level: medium
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.execution
    - attack.stealth
    - attack.t1543.003
    - attack.t1574.011
customer: 'demo'
