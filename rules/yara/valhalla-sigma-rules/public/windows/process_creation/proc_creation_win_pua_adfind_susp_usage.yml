        CommandLine|contains:
            - domainlist
            - trustdmp
            - dcmodes
            - adinfo
            - -sc dclist
            - computer_pwdnotreqd
            - objectcategory=
            - -subnets -f
            - name="Domain Admins"
            - '-sc u:'
            - domainncs
            - dompol
            - ' oudmp '
            - subnetdmp
            - gpodmp
            - fspdmp
            - users_noexpire
            - computers_active
            - computers_pwdnotreqd
falsepositives:
    - Legitimate admin activity
level: high
