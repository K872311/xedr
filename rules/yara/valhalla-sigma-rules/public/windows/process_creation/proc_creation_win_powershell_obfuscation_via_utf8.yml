title: Potential PowerShell Obfuscation Via WCHAR/CHAR
id: e312efd0-35a1-407f-8439-b8d434b438a6
status: test
description: Detects suspicious encoded character syntax often used for defense evasion
references:
    - https://twitter.com/0gtweet/status/1281103918693482496
date: "2020-07-09"
modified: "2025-03-03"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection
    selection:
        CommandLine|contains:
            - '[char]0x'
            - (WCHAR)0x
falsepositives:
    - Unknown
level: high
tags:
    - attack.execution
    - attack.stealth
    - attack.t1059.001
    - attack.t1027
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_powershell_obfuscation_via_utf8/info.yml
