title: Script Event Consumer Spawning Process
id: f6d1dd2f-b8ce-40ca-bc23-062efb686b34
status: test
description: Detects a suspicious child process of Script Event Consumer (scrcons.exe).
references:
    - https://redcanary.com/blog/child-processes/
    - https://docs.paloaltonetworks.com/cortex/cortex-xdr/cortex-xdr-analytics-alert-reference/cortex-xdr-analytics-alert-reference/scrcons-exe-rare-child-process.html
date: "2021-06-21"
modified: "2022-07-14"
author: Sittikorn S
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection
    selection:
        Image|endswith:
            - \svchost.exe
            - \dllhost.exe
            - \powershell.exe
            - \pwsh.exe
            - \wscript.exe
            - \cscript.exe
            - \schtasks.exe
            - \regsvr32.exe
            - \mshta.exe
            - \rundll32.exe
            - \msiexec.exe
            - \msbuild.exe
        ParentImage|endswith: \scrcons.exe
falsepositives:
    - Unknown
level: high
tags:
    - attack.execution
    - attack.t1047
customer: 'demo'
