    - type: obsolete
      id: d4d2574f-ac17-4d9e-b986-aeeae0dc8fe2
status: test
description: Detects the execution of a renamed binary often used by attackers or malware leveraging new Sysmon OriginalFileName datapoint.
references:
    - https://mgreen27.github.io/posts/2019/05/12/BinaryRename.html
    - https://mgreen27.github.io/posts/2019/05/29/BinaryRename2.html
    - https://www.trendmicro.com/vinfo/hk-en/security/news/cybercrime-and-digital-threats/megacortex-ransomware-spotted-attacking-enterprise-networks
    - https://twitter.com/christophetd/status/1164506034720952320
    - https://threatresearch.ext.hp.com/svcready-a-new-loader-reveals-itself/
    - https://www.huntress.com/blog/malicious-browser-extention-crashfix-kongtuke
date: "2019-06-15"
modified: "2026-06-29"
author: Matthew Green - @mgreen27, Florian Roth (Nextron Systems), frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection and not filter
    filter:
        Image|endswith:
            - \certutil.exe
            - \cmstp.exe
            - \cscript.exe
            - \ie4uinit.exe
            - \finger.exe
            - \mshta.exe
            - \msiexec.exe
            - \msxsl.exe
            - \powershell_ise.exe
            - \powershell.exe
            - \psexec.exe
            - \psexec64.exe
            - \psexec64a.exe
            - \PSEXESVC.exe
            - \pwsh.exe
            - \reg.exe
            - \regsvr32.exe
            - \rundll32.exe
            - \wermgr.exe
            - \wmic.exe
            - \wscript.exe
    selection:
        - Description: Execute processes remotely
        - Product: Sysinternals PsExec
        - Description|startswith:
            - Windows PowerShell
            - pwsh
        - OriginalFileName:
            - certutil.exe
            - cmstp.exe
            - cscript.exe
            - IE4UINIT.EXE
            - finger.exe
            - mshta.exe
            - msiexec.exe
            - msxsl.exe
            - powershell_ise.exe
            - powershell.exe
            - psexec.c
            - psexec.exe
            - psexesvc.exe
            - pwsh.dll
            - reg.exe
            - regsvr32.exe
            - rundll32.exe
            - WerMgr
            - wmic.exe
            - wscript.exe
falsepositives:
    - Custom applications use renamed binaries adding slight change to binary name. Typically this is easy to spot and add to whitelist
    - PsExec installed via Windows Store doesn't contain original filename field (False negative)
level: high
tags:
    - attack.stealth
    - attack.t1036.003
    - car.2013-05-009
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_renamed_binary_highly_relevant/info.yml
