title: Potentially Suspicious Child Process of KeyScrambler.exe
id: ca5583e9-8f80-46ac-ab91-7f314d13b984
related:
    - type: similar
      id: d2451be2-b582-4e15-8701-4196ac180260
status: test
description: Detects potentially suspicious child processes of KeyScrambler.exe
references:
    - https://twitter.com/DTCERT/status/1712785421845790799
date: "2024-05-13"
author: Swachchhanda Shrawan Poudel
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_binaries:
        - Image|endswith:
            - \cmd.exe
            - \cscript.exe
            - \mshta.exe
            - \powershell.exe
            - \pwsh.exe
            - \regsvr32.exe
            - \rundll32.exe
            - \wscript.exe
        - OriginalFileName:
            - Cmd.Exe
            - cscript.exe
            - mshta.exe
            - PowerShell.EXE
            - pwsh.dll
            - regsvr32.exe
            - RUNDLL32.EXE
            - wscript.exe
    selection_parent:
        ParentImage|endswith: \KeyScrambler.exe
falsepositives:
    - Unknown
level: medium
tags:
    - attack.persistence
    - attack.execution
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1203
    - attack.t1574.001
