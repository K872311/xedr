title: PowerShell Download Pattern
id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
related:
    - type: derived
      id: e6c54d94-498c-4562-a37c-b469d8e9a275
    - type: obsolete
      id: 8f70ac5f-1f6f-4f8e-b454-db19561216c5
status: test
description: Detects a Powershell process that contains download commands in its command line string
references:
    - https://blog.redteam.pl/2020/06/black-kingdom-ransomware.html
    - https://lab52.io/blog/winter-vivern-all-summer/
    - https://hatching.io/blog/powershell-analysis/
date: "2019-01-16"
modified: "2025-10-20"
author: Florian Roth (Nextron Systems), oscd.community, Jonhnathan Ribeiro
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_cli:
        CommandLine|contains:
            - string(
            - file(
        CommandLine|contains|all:
            - new-object
            - net.webclient).
            - download
    selection_img:
        - Image|endswith:
            - \powershell_ise.exe
            - \powershell.exe
            - \pwsh.exe
        - OriginalFileName:
            - PowerShell_ISE.EXE
            - PowerShell.EXE
            - pwsh.dll
falsepositives:
    - Unknown
level: medium
tags:
    - attack.execution
    - attack.t1059.001
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_powershell_download_patterns/info.yml
