title: Potential PowerShell Obfuscation Via Reversed Commands
id: b6b49cd1-34d6-4ead-b1bf-176e9edba9a4
status: test
description: Detects the presence of reversed PowerShell commands in the CommandLine. This is often used as a method of obfuscation by attackers
references:
    - https://2019.offzone.moscow/ru/report/hunting-for-powershell-abuses/
    - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=66
date: "2020-10-11"
modified: "2023-05-31"
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_* and not 1 of filter_main_*
    filter_main_encoded_keyword:
        CommandLine|contains:
            - ' -EncodedCommand '
            - ' -enc '
    selection_cli:
        CommandLine|contains:
            - hctac
            - kaerb
            - dnammoc
            - ekovn
            - eliFd
            - rahc
            - etirw
            - golon
            - tninon
            - eddih
            - tpircS
            - ssecorp
            - llehsrewop
            - esnopser
            - daolnwod
            - tneilCbeW
            - tneilc
            - ptth
            - elifotevas
            - 46esab
            - htaPpmeTteG
            - tcejbO
            - maerts
            - hcaerof
            - retupmoc
    selection_img:
        - Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        - OriginalFileName:
            - PowerShell.EXE
            - pwsh.dll
falsepositives:
    - Unlikely
level: high
tags:
    - attack.stealth
    - attack.t1027
    - attack.execution
    - attack.t1059.001
customer: 'demo'
