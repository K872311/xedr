license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection
    selection:
        - OriginalFileName: DirLister.exe
        - Image|endswith: \DirLister.exe
falsepositives:
    - Legitimate use by users
level: low
