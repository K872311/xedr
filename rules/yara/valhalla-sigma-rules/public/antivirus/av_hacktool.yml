title: Antivirus - Hacktool Signature
id: fa0c05b6-8ad3-468d-8231-c1cbccb64fba
status: stable
description: |
    Detects a highly relevant Antivirus alert that reports a hack tool or other attack tool.
    This event must not be ignored just because the AV has blocked the malware but investigate, how it came there in the first place.
references:
    - https://www.nextron-systems.com/2021/08/16/antivirus-event-analysis-cheat-sheet-v1-8-2/
    - https://www.nextron-systems.com/?s=antivirus
date: "2021-08-16"
modified: "2026-06-15"
author: Florian Roth (Nextron Systems), Arnim Rupp
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: antivirus
detection:
    condition: selection
    selection:
        - Signature|startswith:
            - ATK/
            - Exploit.Script.CVE
            - HKTL
            - HTOOL
            - PWS.
            - PWSX
            - SecurityTool
        - Signature|contains:
            - Adfind
            - BloodH
            - BloodyAD
            - Brutel
            - BruteR
            - Cobalt
            - COBEACON
            - Cometer
            - DumpCreds
            - EDRfreeze
            - FastReverseProxy
            - Hacktool
            - Havoc
            - Impacket
            - Keylogger
            - Koadic
            - Mimikatz
            - Nighthawk
            - PentestPowerShell
            - Potato
            - PowerSploit
            - PowerSSH
            - PshlSpy
            - PSWTool
            - PWCrack
            - PWDump
            - Responder
            - Rozena
            - Rusthound
            - Sbelt
            - Seatbelt
            - SecurityTool
            - SharpDump
            - SharpHound
            - Shellcode
            - Sliver
            - Snaffler
            - SOAPHound
            - Splinter
            - Stowaway
            - Swrort
            - Trojan.Hound
            - TurtleLoader
            - Undefend
            - Undfnd
falsepositives:
    - Unlikely
level: high
tags:
    - attack.execution
    - attack.t1204
customer: 'demo'
