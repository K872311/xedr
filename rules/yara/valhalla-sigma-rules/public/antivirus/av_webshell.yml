            - ASP_
            - 'ASP:'
            - ASP.Agent
            - ASP/
            - Aspdoor
            - ASPXSpy
            - Backdoor.ASP
            - Backdoor.Java
            - Backdoor.JSP
            - Backdoor.PHP
            - Backdoor.VBS
            - Backdoor/ASP
            - Backdoor/Java
            - Backdoor/JSP
            - Backdoor/PHP
            - Backdoor/VBS
            - C99shell
