license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: webserver
detection:
    condition: keywords
    keywords:
        - '%24%7B%28%23a%3D%40'
        - ${(#a=@
        - '%24%7B%40java'
        - ${@java
        - u0022java
        - '%2F%24%7B%23'
