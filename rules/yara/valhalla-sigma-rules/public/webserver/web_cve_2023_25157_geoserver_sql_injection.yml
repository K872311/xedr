title: Potential CVE-2023-25157 Exploitation Attempt
id: c0341543-5ed0-4475-aabc-7eea8c52aa66
status: test
description: Detects a potential exploitation attempt of CVE-2023-25157 a SQL injection in GeoServer
references:
    - https://github.com/win3zz/CVE-2023-25157
    - https://twitter.com/parzel2/status/1665726454489915395
    - https://github.com/advisories/GHSA-7g5f-wrx8-5ccf
date: "2023-06-14"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: webserver
detection:
    condition: all of selection_*
    selection_payload:
        cs-uri-query|contains:
            - +--
            - +AS+
            - +OR+
            - FROM
            - ORDER+BY
            - SELECT
            - sleep%28
            - substring%28
            - UNION
            - WHERE
    selection_url:
        cs-method: GET
        cs-uri-query|contains:
            - PropertyIsLike
            - strEndsWith
            - strStartsWith
            - FeatureId
            - jsonArrayContains
            - DWithin
        cs-uri-query|contains|all:
            - /geoserver/ows
            - CQL_FILTER=
falsepositives:
    - Vulnerability scanners
level: high
tags:
    - attack.initial-access
    - cve.2023-25157
    - detection.emerging-threats
customer: 'demo'
