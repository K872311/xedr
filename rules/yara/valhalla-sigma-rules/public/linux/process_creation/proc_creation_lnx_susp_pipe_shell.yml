title: Linux Shell Pipe to Shell
id: 880973f3-9708-491c-a77b-2a35a1921158
status: test
description: Detects suspicious process command line that starts with a shell that executes something and finally gets piped into another shell
references:
    - Internal Research
date: "2022-03-14"
modified: "2022-07-26"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: linux
detection:
    condition: all of selection*
    selection:
        CommandLine|startswith:
            - 'sh -c '
            - 'bash -c '
    selection_exec:
        - CommandLine|contains:
            - '| bash '
            - '| sh '
            - '|bash '
            - '|sh '
        - CommandLine|endswith:
            - '| bash'
            - '| sh'
            - '|bash'
            - ' |sh'
falsepositives:
    - Legitimate software that uses these patterns
level: medium
tags:
    - attack.stealth
    - attack.t1140
customer: 'demo'
