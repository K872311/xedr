title: Interactive Bash Suspicious Children
id: ea3ecad2-db86-4a89-ad0b-132a10d2db55
status: test
description: Detects suspicious interactive bash as a parent to rather uncommon child processes
references:
    - Internal Research
date: "2022-03-14"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: linux
detection:
    condition: selection and 1 of anomaly*
    anomaly1:
        CommandLine|contains:
            - '-c import '
            - base64
            - pty.spawn
    anomaly2:
        Image|endswith:
            - whoami
            - iptables
            - /ncat
            - /nc
            - /netcat
    selection:
        ParentCommandLine: bash -i
falsepositives:
    - Legitimate software that uses these patterns
level: medium
tags:
    - attack.execution
    - attack.stealth
    - attack.t1059.004
    - attack.t1036
customer: 'demo'
