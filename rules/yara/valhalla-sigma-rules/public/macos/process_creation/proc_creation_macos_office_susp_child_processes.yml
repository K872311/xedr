title: Suspicious Microsoft Office Child Process - MacOS
id: 69483748-1525-4a6c-95ca-90dc8d431b68
status: test
description: Detects suspicious child processes spawning from microsoft office suite applications such as word or excel. This could indicates malicious macro execution
references:
    - https://redcanary.com/blog/applescript/
    - https://objective-see.org/blog/blog_0x4B.html
date: "2023-01-31"
modified: "2023-02-04"
author: Sohan G (D4rkCiph3r)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: macos
detection:
    condition: selection
    selection:
        Image|endswith:
            - /bash
            - /curl
            - /dash
            - /fish
            - /osacompile
            - /osascript
            - /sh
            - /zsh
            - /python
            - /python3
            - /wget
        ParentImage|contains:
            - Microsoft Word
            - Microsoft Excel
            - Microsoft PowerPoint
            - Microsoft OneNote
falsepositives:
    - Unknown
level: high
tags:
    - attack.execution
    - attack.persistence
    - attack.t1059.002
    - attack.t1137.002
    - attack.t1204.002
customer: 'demo'
