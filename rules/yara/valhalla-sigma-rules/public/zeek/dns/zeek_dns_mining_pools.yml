author: Saw Winn Naung, Azure-Sentinel, @neu5ron
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    product: zeek
    service: dns
detection:
    condition: selection and not 1 of exclude_*
    exclude_answers:
        answers:
            - 127.0.0.1
            - 0.0.0.0
    exclude_rejected:
