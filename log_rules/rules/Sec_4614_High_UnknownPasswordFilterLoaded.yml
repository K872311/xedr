author: CNPC platform
date: 2026-10-20
modified: 2026-10-20

title: 'SAM 加载非系统通知包（疑似密码过滤器后门）'
description: '审计事件 4614 表示 SAM 加载了通知包（Notification Package）。恶意密码过滤器 DLL 能在每次改密时截获明文密码。已排除系统自带的 scecli 与 rassfm。'

id: 6c0e2f4a-9b1d-4e57-8a3c-1f2b7d4e9a09
level: high
status: experimental
logsource:
    product: windows
    service: security
detection:
    selection:
        Channel: Security
        EventID: 4614
    filter_builtin:
        NotificationPackageName|contains:
            - 'scecli'
            - 'rassfm'
    condition: selection and not filter_builtin
falsepositives:
    - 企业密码策略组件（如 LAPS 旧版、第三方密码策略）
tags:
    - attack.credential-access
    - attack.t1556.002
references:
    - https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4614
ruletype: Hayabusa
