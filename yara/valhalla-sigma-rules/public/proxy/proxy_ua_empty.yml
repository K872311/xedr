title: HTTP Request With Empty User Agent
id: 21e44d78-95e7-421b-a464-ffd8395659c4
status: test
description: |
    Detects a potentially suspicious empty user agent strings in proxy log.
    Could potentially indicate an uncommon request method.
references:
    - https://twitter.com/Carlos_Perez/status/883455096645931008
date: "2017-07-08"
modified: "2021-11-27"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: proxy
detection:
    condition: selection
    selection:
        c-useragent: ""
falsepositives:
    - Unknown
level: medium
tags:
    - attack.command-and-control
    - attack.t1071.001
customer: 'demo'
