title: Suspicious Package Installed - Linux
id: 700fb7e8-2981-401c-8430-be58e189e741
status: test
description: Detects installation of suspicious packages using system installation utilities
references:
    - https://gist.githubusercontent.com/MichaelKoczwara/12faba9c061c12b5814b711166de8c2f/raw/e2068486692897b620c25fde1ea258c8218fe3d3/history.txt
date: "2023-01-03"
modified: "2026-01-01"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: linux
detection:
    condition: 1 of selection_tool_* and selection_keyword
    selection_keyword:
        CommandLine|contains:
            - nmap
            - ' nc'
            - netcat
            - wireshark
            - tshark
            - openconnect
            - proxychains
            - socat
    selection_tool_apt:
        CommandLine|contains: install
        Image|endswith:
            - /apt
            - /apt-get
    selection_tool_dpkg:
        CommandLine|contains:
            - --install
            - -i
        Image|endswith: /dpkg
    selection_tool_rpm:
        CommandLine|contains: -i
        Image|endswith: /rpm
    selection_tool_yum:
        CommandLine|contains:
            - localinstall
            - install
        Image|endswith: /yum
falsepositives:
    - Legitimate administration activities
level: medium
tags:
    - attack.defense-impairment
    - attack.t1553.004
customer: 'demo'
