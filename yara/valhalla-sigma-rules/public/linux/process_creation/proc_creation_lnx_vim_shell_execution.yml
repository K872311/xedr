title: Vim GTFOBin Abuse - Linux
id: 7ab8f73a-fcff-428b-84aa-6a5ff7877dea
status: test
description: |
    Detects the use of "vim" and it's siblings commands to execute a shell or proxy commands.
    Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
references:
    - https://gtfobins.github.io/gtfobins/vi/
    - https://gtfobins.github.io/gtfobins/vim/
    - https://gtfobins.github.io/gtfobins/rvim/
    - https://gtfobins.github.io/gtfobins/vimdiff/
date: "2022-12-28"
modified: "2026-06-05"
author: Nasreddine Bencherchali (Nextron Systems), Luc Génaux
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: linux
detection:
    condition: all of selection_*
    selection_cli:
        CommandLine|contains:
            - :!/
            - :!$
            - :!..
            - ':lua '
            - ':py '
            - :shell
            - /bin/bash
            - /bin/dash
            - /bin/fish
            - /bin/sh
            - /bin/csh
            - /bin/ksh
            - /bin/zsh
            - /bin/tmux
    selection_img:
        CommandLine|contains:
            - ' --cmd '
            - ' -c'
        Image|endswith:
            - /rvim
            - /vi
            - /vim
            - /vimdiff
falsepositives:
    - Unknown
level: high
tags:
    - attack.execution
    - attack.discovery
    - attack.t1059
    - attack.t1083
customer: 'demo'
