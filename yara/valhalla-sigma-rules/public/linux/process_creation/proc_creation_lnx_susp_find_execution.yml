title: Potential Discovery Activity Using Find - Linux
id: 8344c0e5-5783-47cc-9cf9-a0f7fd03e6cf
related:
    - type: similar
      id: 85de3a19-b675-4a51-bfc6-b11a5186c971
status: test
description: Detects usage of "find" binary in a suspicious manner to perform discovery
references:
    - https://github.com/SaiSathvik1/Linux-Privilege-Escalation-Notes
date: "2022-12-28"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: linux
detection:
    condition: selection
    selection:
        CommandLine|contains:
            - -perm -4000
            - -perm -2000
            - -perm 0777
            - -perm -222
            - -perm -o w
            - -perm -o x
            - -perm -u=s
            - -perm -g=s
        Image|endswith: /find
falsepositives:
    - Unknown
level: medium
tags:
    - attack.discovery
    - attack.t1083
customer: 'demo'
