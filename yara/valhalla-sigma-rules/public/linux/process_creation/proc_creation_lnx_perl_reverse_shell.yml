title: Potential Perl Reverse Shell Execution
id: 259df6bc-003f-4306-9f54-4ff1a08fa38e
status: test
description: Detects execution of the perl binary with the "-e" flag and common strings related to potential reverse shell activity
references:
    - https://pentestmonkey.net/cheat-sheet/shells/reverse-shell-cheat-sheet
    - https://www.revshells.com/
date: "2023-04-07"
author: '@d4ns4n_, Nasreddine Bencherchali (Nextron Systems)'
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: linux
detection:
    condition: all of selection_*
    selection_content:
        - CommandLine|contains|all:
            - fdopen(
            - ::Socket::INET
        - CommandLine|contains|all:
            - Socket
            - connect
            - open
            - exec
    selection_img:
        CommandLine|contains: ' -e '
        Image|endswith: /perl
falsepositives:
    - Unlikely
level: high
tags:
    - attack.execution
customer: 'demo'
