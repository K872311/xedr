title: WScript or CScript Dropper - File
id: 002bdb95-0cf1-46a6-9e08-d38c128a6127
related:
    - type: derived
      id: cea72823-df4d-4567-950c-0b579eaf0846
status: test
description: Detects a file ending in jse, vbe, js, vba, vbs, wsf, wsh written by cscript.exe or wscript.exe
references:
    - WScript or CScript Dropper (cea72823-df4d-4567-950c-0b579eaf0846)
date: "2022-01-10"
modified: "2026-02-17"
author: Tim Shelton
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: file_event
    product: windows
detection:
    condition: selection
    selection:
        Image|endswith:
            - \wscript.exe
            - \cscript.exe
        TargetFilename|contains:
            - :\Perflogs\
            - :\ProgramData\
            - :\Temp\
            - :\Tmp\
            - :\Users\
            - :\Windows\Temp\
            - \AppData\Local\Temp
            - \AppData\Roaming\Temp
            - \Start Menu\Programs\Startup\
            - \Temporary Internet
        TargetFilename|endswith:
            - .js
            - .jse
            - .vba
            - .vbe
            - .vbs
            - .wsf
            - .wsh
falsepositives:
    - Unknown
level: high
tags:
    - attack.execution
    - attack.t1059.005
    - attack.t1059.007
customer: 'demo'
