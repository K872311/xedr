title: Legitimate Application Writing Files In Uncommon Location
id: 1cf465a1-2609-4c15-9b66-c32dbe4bfd67
related:
    - type: similar
      id: 2ddef153-167b-4e89-86b6-757a9e65dcac
status: experimental
description: |
    Detects legitimate applications writing any type of file to uncommon or suspicious locations that are not typical for application data storage or execution.
    Adversaries may leverage legitimate applications (Living off the Land Binaries - LOLBins) to drop or download malicious files to uncommon locations on the system to evade detection by security solutions.
references:
    - https://lolbas-project.github.io/#/download
date: "2025-12-10"
modified: "2026-10-14"
author: Swachchhanda Shrawan Poudel (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: file_event
    product: windows
detection:
    condition: all of selection_* and not 1 of filter_optional_*
    filter_optional_dell_techhub_copy:
        Image|endswith: \esentutl.exe
        TargetFilename|startswith: C:\ProgramData\Dell\DTP\DB\SRUDBData\
    filter_optional_dell_techhub_repair:
        Image|endswith: \esentutl.exe
        TargetFilename|endswith:
            - .INTEG.RAW
            - .EDB
        TargetFilename|startswith:
            - C:\Windows\System32\SRUDB_
            - C:\Windows\System32\TEMPREPAIR
    selection_img:
        Image|endswith:
            - \eqnedt32.exe
            - \wordpad.exe
            - \wordview.exe
            - \cmdl32.exe
            - \certutil.exe
            - \certoc.exe
            - \CertReq.exe
            - \bitsadmin.exe
            - \Desktopimgdownldr.exe
            - \esentutl.exe
            - \expand.exe
            - \extrac32.exe
            - \replace.exe
            - \mshta.exe
            - \ftp.exe
            - \Ldifde.exe
            - \RdrCEF.exe
            - \hh.exe
            - \finger.exe
            - \findstr.exe
    selection_locations:
        TargetFilename|contains:
            - :\Perflogs
            - :\ProgramData\
            - :\Temp\
            - :\Users\Public\
            - :\Windows\
            - \$Recycle.Bin\
            - \AppData\Local\
            - \AppData\Roaming\
            - \Contacts\
            - \Desktop\
            - \Favorites\
            - \Favourites\
            - \inetpub\wwwroot\
            - \Music\
            - \Pictures\
            - \Start Menu\Programs\Startup\
            - \Users\Default\
            - \Videos\
falsepositives:
    - Unknown
level: high
tags:
    - attack.stealth
    - attack.t1218
    - attack.command-and-control
    - attack.t1105
customer: 'demo'
regression_tests_path: regression_data/rules/windows/file/file_event/file_event_win_susp_legitimate_app_dropping_in_uncommon_location/info.yml
