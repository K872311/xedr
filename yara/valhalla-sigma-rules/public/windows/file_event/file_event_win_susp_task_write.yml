title: Suspicious Scheduled Task Write to System32 Tasks
id: 80e1f67a-4596-4351-98f5-a9c3efabac95
status: test
description: Detects the creation of tasks from processes executed from suspicious locations
references:
    - Internal Research
date: "2021-11-16"
modified: "2022-01-12"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: file_event
    product: windows
detection:
    condition: selection
    selection:
        Image|contains:
            - \AppData\
            - C:\PerfLogs
            - \Windows\System32\config\systemprofile
        TargetFilename|contains: \Windows\System32\Tasks
falsepositives:
    - Unknown
level: high
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.execution
    - attack.t1053
customer: 'demo'
