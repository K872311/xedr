title: Office Macro File Creation
id: 91174a41-dc8f-401b-be89-7bfc140612a0
related:
    - type: similar
      id: 0e29e3a7-1ad8-40aa-b691-9f82ecd33d66
status: test
description: Detects the creation of a new office macro files on the systems
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1566.001/T1566.001.md
    - https://learn.microsoft.com/en-us/deployoffice/compat/office-file-format-reference
date: "2022-01-23"
modified: "2026-01-09"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: file_event
    product: windows
detection:
    condition: selection and not 1 of filter_main_*
    filter_main_office:
        Image|endswith:
            - \WINWORD.EXE
            - \EXCEL.EXE
            - \POWERPNT.EXE
        Image|startswith:
            - C:\Program Files\Microsoft Office\
            - C:\Program Files (x86)\Microsoft Office\
        TargetFilename|contains: \~$
    selection:
        TargetFilename|endswith:
            - .docm
            - .dotm
            - .xlsm
            - .xltm
            - .potm
            - .pptm
falsepositives:
    - Very common in environments that rely heavily on macro documents
level: low
tags:
    - attack.initial-access
    - attack.t1566.001
customer: 'demo'
