title: .RDP File Created By Uncommon Application
id: fccfb43e-09a7-4bd2-8b37-a5a7df33386d
related:
    - type: derived
      id: f748c45a-f8d3-4e6f-b617-fe176f695b8f
status: test
description: |
    Detects creation of a file with an ".rdp" extension by an application that doesn't commonly create such files.
references:
    - https://www.blackhillsinfosec.com/rogue-rdp-revisiting-initial-access-methods/
    - https://web.archive.org/web/20230726144748/https://blog.thickmints.dev/mintsights/detecting-rogue-rdp/
date: "2023-04-18"
modified: "2024-11-01"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: file_event
    product: windows
detection:
    condition: selection
    selection:
        Image|endswith:
            - \brave.exe
            - \CCleaner Browser\Application\CCleanerBrowser.exe
            - \chromium.exe
            - \firefox.exe
            - \Google\Chrome\Application\chrome.exe
            - \iexplore.exe
            - \microsoftedge.exe
            - \msedge.exe
            - \Opera.exe
            - \Vivaldi.exe
            - \Whale.exe
            - \olk.exe
            - \Outlook.exe
            - \RuntimeBroker.exe
            - \Thunderbird.exe
            - \Discord.exe
            - \Keybase.exe
            - \msteams.exe
            - \Slack.exe
            - \teams.exe
        TargetFilename|endswith: .rdp
falsepositives:
    - Unknown
level: high
tags:
    - attack.stealth
customer: 'demo'
