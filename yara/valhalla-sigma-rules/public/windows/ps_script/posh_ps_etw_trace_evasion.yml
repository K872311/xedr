title: Disable of ETW Trace - Powershell
id: 115fdba9-f017-42e6-84cf-d5573bf2ddf8
related:
    - type: derived
      id: a238b5d0-ce2d-4414-a676-7a531b3d13d6
status: test
description: Detects usage of powershell cmdlets to disable or remove ETW trace sessions
references:
    - https://medium.com/palantir/tampering-with-windows-event-tracing-background-offense-and-defense-4be7ac62ac63
date: "2022-06-28"
modified: "2026-10-12"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: ps_script
    product: windows
    definition: 'Requirements: Script Block Logging must be enabled'
detection:
    condition: 1 of selection_*
    selection_pwsh_remove:
        ScriptBlockText|contains: 'Remove-EtwTraceProvider '
    selection_pwsh_set_dec:
        - ScriptBlockText|contains|all:
            - 'Set-EtwTraceProvider '
            - ' 17'
        - ScriptBlockText|contains|all:
            - 'Set-EtwTraceProvider '
            - “'17'”
        - ScriptBlockText|contains|all:
            - 'Set-EtwTraceProvider '
            - ”17”
    selection_pwsh_set_hex:
        ScriptBlockText|contains|all:
            - 'Set-EtwTraceProvider '
            - "0x11"
falsepositives:
    - Unknown
level: high
tags:
    - attack.stealth
    - attack.defense-impairment
    - attack.t1070
    - attack.t1685
    - car.2016-04-002
customer: 'demo'
