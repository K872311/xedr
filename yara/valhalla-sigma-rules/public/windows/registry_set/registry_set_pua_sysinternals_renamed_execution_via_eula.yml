title: Suspicious Execution Of Renamed Sysinternals Tools - Registry
id: f50f3c09-557d-492d-81db-9064a8d4e211
related:
    - type: derived
      id: 25ffa65d-76d8-4da5-a832-3f2b0136e133
    - type: similar
      id: 8023f872-3f1d-4301-a384-801889917ab4
status: test
description: Detects the creation of the "accepteula" key related to the Sysinternals tools being created from executables with the wrong name (e.g. a renamed Sysinternals tool)
references:
    - Internal Research
date: "2022-08-24"
modified: "2026-06-29"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: registry_set
    product: windows
detection:
    condition: selection and not filter
    filter:
        Image|endswith:
            - \ADExplorer.exe
            - \ADExplorer64.exe
            - \ADExplorer64a.exe
            - \handle.exe
            - \handle64.exe
            - \handle64a.exe
            - \livekd.exe
            - \livekd64.exe
            - \procdump.exe
            - \procdump64.exe
            - \procdump64a.exe
            - \procexp.exe
            - \procexp64.exe
            - \procexp64a.exe
            - \PsExec.exe
            - \PsExec64.exe
            - \PsExec64a.exe
            - \PsLoggedon.exe
            - \PsLoggedon64.exe
            - \psloglist.exe
            - \psloglist64.exe
            - \psloglist64a.exe
            - \pspasswd.exe
            - \pspasswd64.exe
            - \pspasswd64a.exe
            - \PsPing.exe
            - \PsPing64.exe
            - \PsPing64a.exe
            - \PsService.exe
            - \PsService64.exe
            - \PsService64a.exe
            - \sdelete.exe
    selection:
        TargetObject|contains:
            - \Active Directory Explorer
            - \Handle
            - \LiveKd
            - \ProcDump
            - \Process Explorer
            - \PsExec
            - \PsLoggedon
            - \PsLoglist
            - \PsPasswd
            - \PsPing
            - \PsService
            - \SDelete
        TargetObject|endswith: \EulaAccepted
falsepositives:
    - Unlikely
level: high
tags:
    - attack.resource-development
    - attack.t1588.002
customer: 'demo'
regression_tests_path: regression_data/rules/windows/registry/registry_set/registry_set_pua_sysinternals_renamed_execution_via_eula/info.yml
