title: Macro Enabled In A Potentially Suspicious Document
id: a166f74e-bf44-409d-b9ba-ea4b2dd8b3cd
related:
    - type: derived
      id: 295a59c1-7b79-4b47-a930-df12c15fc9c2
status: test
description: Detects registry changes to Office trust records where the path is located in a potentially suspicious location
references:
    - https://twitter.com/inversecos/status/1494174785621819397
    - Internal Research
date: "2023-06-21"
modified: "2023-08-17"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: registry_set
    product: windows
detection:
    condition: all of selection_*
    selection_paths:
        TargetObject|contains:
            - /AppData/Local/Microsoft/Windows/INetCache/
            - /AppData/Local/Temp/
            - /PerfLogs/
            - C:/Users/Public/
            - file:///D:/
            - file:///E:/
    selection_value:
        TargetObject|contains: \Security\Trusted Documents\TrustRecords
falsepositives:
    - Unlikely
level: high
tags:
    - attack.persistence
    - attack.defense-impairment
    - attack.t1112
customer: 'demo'
