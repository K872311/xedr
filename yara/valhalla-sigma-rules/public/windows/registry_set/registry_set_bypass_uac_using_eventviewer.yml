logsource:
    category: registry_set
    product: windows
detection:
    condition: selection and not filter
    filter:
        Details|startswith: '%SystemRoot%\system32\mmc.exe "%1" %'
    selection:
        TargetObject|endswith: _Classes\mscfile\shell\open\command\(Default)
falsepositives:
    - Unknown
level: high
