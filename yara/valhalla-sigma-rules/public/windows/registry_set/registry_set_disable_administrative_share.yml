    product: windows
detection:
    condition: selection
    selection:
        Details: DWORD (0x00000000)
        TargetObject|contains: \Services\LanmanServer\Parameters\
        TargetObject|endswith:
            - \AutoShareWks
            - \AutoShareServer
falsepositives:
