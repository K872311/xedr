title: Cscript/Wscript Uncommon Script Extension Execution
id: 99b7460d-c9f1-40d7-a316-1f36f61d52ee
status: test
description: Detects Wscript/Cscript executing a file with an uncommon (i.e. non-script) extension
references:
    - Internal Research
date: "2023-05-15"
modified: "2023-06-19"
author: Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_extension:
        CommandLine|contains:
            - .csv
            - .dat
            - .doc
            - .gif
            - .jpeg
            - .jpg
            - .png
            - .ppt
            - .txt
            - .xls
            - .xml
    selection_img:
        - OriginalFileName:
            - wscript.exe
            - cscript.exe
        - Image|endswith:
            - \wscript.exe
            - \cscript.exe
falsepositives:
    - Unknown
level: high
tags:
    - attack.execution
    - attack.t1059.005
    - attack.t1059.007
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_wscript_cscript_uncommon_extension_exec/info.yml
