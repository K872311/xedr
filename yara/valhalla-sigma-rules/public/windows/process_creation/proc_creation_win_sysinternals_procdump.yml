title: Procdump Execution
id: 2e65275c-8288-4ab4-aeb7-6274f58b6b20
status: test
description: Detects usage of the SysInternals Procdump utility
references:
    - https://learn.microsoft.com/en-us/sysinternals/downloads/procdump
date: "2021-08-16"
modified: "2026-06-29"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection
    selection:
        Image|endswith:
            - \procdump.exe
            - \procdump64.exe
            - \procdump64a.exe
falsepositives:
    - Legitimate use of procdump by a developer or administrator
level: medium
tags:
    - attack.stealth
    - attack.t1036
    - attack.t1003.001
    - attack.credential-access
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_sysinternals_procdump/info.yml
