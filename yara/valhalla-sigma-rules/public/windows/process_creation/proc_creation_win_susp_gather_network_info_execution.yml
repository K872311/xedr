logsource:
    category: process_creation
    product: windows
detection:
    condition: selection and not filter
    filter:
        Image|endswith:
            - \cscript.exe
            - \wscript.exe
    selection:
        CommandLine|contains: gatherNetworkInfo.vbs
falsepositives:
    - Unknown
level: high
