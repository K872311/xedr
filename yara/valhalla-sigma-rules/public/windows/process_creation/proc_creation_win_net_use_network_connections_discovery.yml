title: System Network Connections Discovery Via Net.EXE
id: 1c67a717-32ba-409b-a45d-0fb704a73a81
status: test
description: Adversaries may attempt to get a listing of network connections to or from the compromised system they are currently accessing or from remote systems by querying for information over the network.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1049/T1049.md#atomic-test-1---system-network-connections-discovery
date: "2021-12-10"
modified: "2023-02-21"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_cli:
        - CommandLine|endswith:
            - ' use'
            - ' sessions'
        - CommandLine|contains:
            - ' use '
            - ' sessions '
    selection_img:
        - Image|endswith:
            - \net.exe
            - \net1.exe
        - OriginalFileName:
            - net.exe
            - net1.exe
falsepositives:
    - Unknown
level: low
tags:
    - attack.discovery
    - attack.t1049
customer: 'demo'
