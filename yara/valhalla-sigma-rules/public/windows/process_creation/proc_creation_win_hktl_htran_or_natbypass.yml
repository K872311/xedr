title: HackTool - Htran/NATBypass Execution
id: f5e3b62f-e577-4e59-931e-0a15b2b94e1e
status: test
description: Detects executable names or flags used by Htran or Htran-like tools (e.g. NATBypass)
references:
    - https://github.com/HiwinCN/HTran
    - https://github.com/cw1997/NATBypass
date: "2022-12-27"
modified: "2023-02-04"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: 1 of selection_*
    selection_cli:
        CommandLine|contains:
            - '.exe -tran '
            - '.exe -slave '
    selection_img:
        Image|endswith:
            - \htran.exe
            - \lcx.exe
falsepositives:
    - Unknown
level: high
tags:
    - attack.command-and-control
    - attack.t1090
    - attack.s0040
customer: 'demo'
