logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_cli:
        CommandLine|contains:
            - http://
            - https://
    selection_img:
        - Image|endswith: \IMEWDBLD.exe
        - OriginalFileName: imewdbld.exe
