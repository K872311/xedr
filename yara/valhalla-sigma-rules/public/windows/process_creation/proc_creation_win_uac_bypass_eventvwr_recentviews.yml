logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_path:
        CommandLine|contains:
            - \Event Viewer\RecentViews
            - \EventV~1\RecentViews
    selection_redirect:
        CommandLine|contains: '>'
falsepositives:
    - Unknown
level: high
tags:
