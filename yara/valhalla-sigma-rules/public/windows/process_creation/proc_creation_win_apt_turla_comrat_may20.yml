title: Turla Group Commands May 2020
id: 9e2e51c5-c699-4794-ba5a-29f5da40ac0c
status: test
description: Detects commands used by Turla group as reported by ESET in May 2020
references:
    - https://www.welivesecurity.com/wp-content/uploads/2020/05/ESET_Turla_ComRAT.pdf
date: "2020-05-26"
modified: "2025-10-19"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: 1 of selection_*
    selection_cli_1:
        CommandLine|contains:
            - tracert -h 10 yahoo.com
            - .WSqmCons))|iex;
            - Fr`omBa`se6`4Str`ing
    selection_cli_2:
        CommandLine|contains: '@aol.co.uk'
        CommandLine|re: net\s+use\s+https://docs.live.net
falsepositives:
    - Unknown
level: critical
tags:
    - attack.privilege-escalation
    - attack.persistence
    - attack.stealth
    - attack.g0010
    - attack.execution
    - attack.t1059.001
    - attack.t1053.005
    - attack.t1027
    - detection.emerging-threats
customer: 'demo'
