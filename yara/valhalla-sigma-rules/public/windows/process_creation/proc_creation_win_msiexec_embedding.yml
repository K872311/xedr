title: Suspicious MsiExec Embedding Parent
id: 4a2a2c3e-209f-4d01-b513-4155a540b469
status: test
description: Adversaries may abuse msiexec.exe to proxy the execution of malicious payloads
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1218.007/T1218.007.md
date: "2022-04-16"
modified: "2022-07-14"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection and not 1 of filter*
    filter_splunk_ufw:
        CommandLine|contains: C:\Program Files\SplunkUniversalForwarder\bin\
        Image|endswith: :\Windows\System32\cmd.exe
    filter_vs:
        - CommandLine|contains: \DismFoDInstall.cmd
        - ParentCommandLine|contains|all:
            - '\MsiExec.exe -Embedding '
            - Global\MSI0000
    selection:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
            - \cmd.exe
        ParentCommandLine|contains|all:
            - MsiExec.exe
            - '-Embedding '
falsepositives:
    - Unknown
level: medium
tags:
    - attack.stealth
    - attack.t1218.007
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_msiexec_embedding/info.yml
