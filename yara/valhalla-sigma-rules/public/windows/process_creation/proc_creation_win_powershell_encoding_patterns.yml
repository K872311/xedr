title: Potential Encoded PowerShell Patterns In CommandLine
id: cdf05894-89e7-4ead-b2b0-0a5f97a90f2f
related:
    - type: similar
      id: 5b572dcf-254b-425c-a8c5-d9af6bea35a6
status: test
description: Detects specific combinations of encoding methods in PowerShell via the commandline
references:
    - https://speakerdeck.com/heirhabarov/hunting-for-powershell-abuse?slide=65
date: "2020-10-11"
modified: "2023-01-26"
author: Teymur Kheirkhabarov (idea), Vasiliy Burov (rule), oscd.community, Tim Shelton
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection_img and (all of selection_to_* or 1 of selection_gen_*)
    selection_gen_1:
        CommandLine|contains|all:
            - char
            - join
    selection_gen_2:
        CommandLine|contains|all:
            - split
            - join
    selection_img:
        - Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        - OriginalFileName:
            - PowerShell.EXE
            - pwsh.dll
    selection_to_1:
        CommandLine|contains:
            - ToInt
            - ToDecimal
            - ToByte
            - ToUint
            - ToSingle
            - ToSByte
    selection_to_2:
        CommandLine|contains:
            - ToChar
            - ToString
            - String
falsepositives:
    - Unknown
level: low
tags:
    - attack.stealth
    - attack.t1027
    - attack.execution
    - attack.t1059.001
customer: 'demo'
