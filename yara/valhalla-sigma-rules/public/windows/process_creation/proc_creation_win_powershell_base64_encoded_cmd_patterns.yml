title: Suspicious PowerShell Encoded Command Patterns
id: b9d9cc83-380b-4ba3-8d8f-60c0e7e2930c
status: test
description: Detects PowerShell command line patterns in combincation with encoded commands that often appear in malware infection chains
references:
    - https://app.any.run/tasks/b9040c63-c140-479b-ad59-f1bb56ce7a97/
date: "2022-05-24"
modified: "2023-01-05"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_* and not 1 of filter_*
    filter_gcworker:
        ParentImage|contains:
            - C:\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
            - \gc_worker.exe
    selection_encoded:
        CommandLine|contains:
            - ' JAB'
            - ' SUVYI'
            - ' SQBFAFgA'
            - ' aWV4I'
            - ' IAB'
            - ' PAA'
            - ' aQBlAHgA'
    selection_flags:
        CommandLine|contains:
            - ' -e '
            - ' -en '
            - ' -enc '
            - ' -enco'
    selection_img:
        - Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        - OriginalFileName:
            - PowerShell.Exe
            - pwsh.dll
falsepositives:
    - Other tools that work with encoded scripts in the command line instead of script files
level: high
tags:
    - attack.execution
    - attack.t1059.001
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_powershell_base64_encoded_cmd_patterns/info.yml
