title: Suspicious PowerShell Invocation From Script Engines
id: 95eadcb2-92e4-4ed1-9031-92547773a6db
status: test
description: Detects suspicious powershell invocations from interpreters or unusual programs
references:
    - https://www.securitynewspaper.com/2017/03/20/attackers-leverage-excel-powershell-dns-latest-non-malware-attack/
date: "2019-01-16"
modified: "2023-01-05"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection and not 1 of filter_*
    filter_health_service:
        CurrentDirectory|contains: \Health Service State\
    selection:
        Image|endswith:
            - \powershell.exe
            - \pwsh.exe
        ParentImage|endswith:
            - \wscript.exe
            - \cscript.exe
falsepositives:
    - Microsoft Operations Manager (MOM)
    - Other scripts
level: medium
tags:
    - attack.execution
    - attack.t1059.001
customer: 'demo'
