title: Ps.exe Renamed SysInternals Tool
id: 18da1007-3f26-470f-875d-f77faf1cab31
status: test
description: Detects renamed SysInternals tool execution with a binary named ps.exe as used by Dragonfly APT group and documented in TA17-293A report
references:
    - https://www.us-cert.gov/ncas/alerts/TA17-293A
date: "2017-10-22"
modified: "2023-05-02"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection
    selection:
        CommandLine|contains|all:
            - ps.exe -accepteula
            - -s cmd /c netstat
falsepositives:
    - Renamed SysInternals tool
level: high
tags:
    - attack.stealth
    - attack.g0035
    - attack.t1036.003
    - car.2013-05-009
    - detection.emerging-threats
customer: 'demo'
