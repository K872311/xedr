title: Suspicious Calculator Usage
id: 737e618a-a410-49b5-bec3-9e55ff7fbc15
status: test
description: |
    Detects suspicious use of 'calc.exe' with command line parameters or in a suspicious directory, which is likely caused by some PoC or detection evasion.
references:
    - https://twitter.com/ItsReallyNick/status/1094080242686312448
date: "2019-02-09"
modified: "2023-11-09"
author: Florian Roth (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection_1 or ( selection_2 and not filter_main_known_locations )
    filter_main_known_locations:
        Image|contains:
            - :\Windows\System32\
            - :\Windows\SysWOW64\
            - :\Windows\WinSxS\
    selection_1:
        CommandLine|contains: '\calc.exe '
    selection_2:
        Image|endswith: \calc.exe
falsepositives:
    - Unknown
level: high
tags:
    - attack.stealth
    - attack.t1036
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_calc_uncommon_exec/info.yml
