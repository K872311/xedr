title: Windows Firewall Disabled via PowerShell
id: 12f6b752-042d-483e-bf9c-915a6d06ad75
related:
    - type: similar
      id: 488b44e7-3781-4a71-888d-c95abfacf44d
status: test
description: Detects attempts to disable the Windows Firewall using PowerShell
references:
    - https://www.elastic.co/guide/en/security/current/windows-firewall-disabled-via-powershell.html
date: "2022-09-14"
modified: "2023-02-13"
author: Tim Rauch, Elastic (idea)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_args:
        CommandLine|contains|all:
            - 'Set-NetFirewallProfile '
            - ' -Enabled '
            - ' False'
    selection_name:
        - Image|endswith:
            - \powershell.exe
            - \pwsh.exe
            - \powershell_ise.exe
        - OriginalFileName:
            - PowerShell.EXE
            - pwsh.dll
    selection_opt:
        CommandLine|contains:
            - ' -All '
            - Public
            - Domain
            - Private
falsepositives:
    - Unknown
level: medium
tags:
    - attack.defense-impairment
    - attack.t1685
customer: 'demo'
