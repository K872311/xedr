title: Lazarus System Binary Masquerading
id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
status: test
description: Detects binaries used by the Lazarus group which use system names but are executed and launched from non-default location
references:
    - https://media.kasperskycontenthub.com/wp-content/uploads/sites/43/2018/03/07180244/Lazarus_Under_The_Hood_PDF_final.pdf
date: "2020-06-03"
modified: "2023-03-10"
author: Trent Liffick (@tliffick), Bartlomiej Czyz (@bczyz1)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection and not filter
    filter:
        Image|startswith:
            - C:\Windows\System32\
            - C:\Windows\SysWOW64\
    selection:
        Image|endswith:
            - \msdtc.exe
            - \gpsvc.exe
falsepositives:
    - Unlikely
level: high
tags:
    - attack.stealth
    - attack.t1036.005
    - detection.emerging-threats
customer: 'demo'
