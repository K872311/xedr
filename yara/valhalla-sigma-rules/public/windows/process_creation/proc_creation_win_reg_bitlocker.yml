title: Suspicious Reg Add BitLocker
id: 0e0255bf-2548-47b8-9582-c0955c9283f5
status: test
description: Detects suspicious addition to BitLocker related registry keys via the reg.exe utility
references:
    - https://thedfirreport.com/2021/11/15/exchange-exploit-leads-to-domain-wide-ransomware/
date: "2021-11-15"
modified: "2022-09-09"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection
    selection:
        CommandLine|contains:
            - EnableBDEWithNoTPM
            - UseAdvancedStartup
            - UseTPM
            - UseTPMKey
            - UseTPMKeyPIN
            - RecoveryKeyMessageSource
            - UseTPMPIN
            - RecoveryKeyMessage
        CommandLine|contains|all:
            - REG
            - ADD
            - \SOFTWARE\Policies\Microsoft\FVE
            - /v
            - /f
falsepositives:
    - Unlikely
level: high
tags:
    - attack.impact
    - attack.t1486
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_reg_bitlocker/info.yml
