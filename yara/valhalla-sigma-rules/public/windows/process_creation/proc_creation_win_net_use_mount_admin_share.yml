title: Windows Admin Share Mount Via Net.EXE
id: 3abd6094-7027-475f-9630-8ab9be7b9725
related:
    - type: similar
      id: f117933c-980c-4f78-b384-e3d838111165
status: test
description: Detects when an admin share is mounted using net.exe
references:
    - https://drive.google.com/file/d/1lKya3_mLnR3UQuCoiYruO3qgu052_iS_/view
date: "2020-10-05"
modified: "2023-02-21"
author: oscd.community, Teymur Kheirkhabarov @HeirhabarovT, Zach Stanford @svch0st, wagga
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_cli:
        CommandLine|contains|all:
            - ' use '
            - ' \\\\*\\*$'
    selection_img:
        - Image|endswith:
            - \net.exe
            - \net1.exe
        - OriginalFileName:
            - net.exe
            - net1.exe
falsepositives:
    - Administrators
level: medium
tags:
    - attack.lateral-movement
    - attack.t1021.002
customer: 'demo'
