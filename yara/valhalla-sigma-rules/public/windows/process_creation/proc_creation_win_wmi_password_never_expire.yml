title: Password Set to Never Expire via WMI
id: 7864a175-3654-4824-9f0d-f0da18ab27c0
status: experimental
description: |
    Detects the use of wmic.exe to modify user account settings and explicitly disable password expiration.
references:
    - https://www.huntress.com/blog/the-unwanted-guest
date: "2025-07-30"
author: Daniel Koifman (KoifSec)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: all of selection_*
    selection_cli:
        CommandLine|contains|all:
            - useraccount
            - ' set '
            - passwordexpires
            - "false"
    selection_img:
        - Image|endswith: \wmic.exe
        - OriginalFileName: wmic.exe
falsepositives:
    - Legitimate administrative activity
level: medium
tags:
    - attack.privilege-escalation
    - attack.execution
    - attack.persistence
    - attack.t1047
    - attack.t1098
customer: 'demo'
