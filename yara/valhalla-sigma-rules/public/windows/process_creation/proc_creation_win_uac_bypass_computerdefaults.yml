title: UAC Bypass Tools Using ComputerDefaults
id: 3c05e90d-7eba-4324-9972-5d7f711a60a8
status: test
description: Detects tools such as UACMe used to bypass UAC with computerdefaults.exe (UACMe 59)
references:
    - https://github.com/hfiref0x/UACME
date: "2021-08-31"
modified: "2024-12-01"
author: Christian Burkard (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection and not filter
    filter:
        ParentImage|contains:
            - :\Windows\System32
            - :\Program Files
    selection:
        Image: C:\Windows\System32\ComputerDefaults.exe
        IntegrityLevel:
            - High
            - System
            - S-1-16-16384
            - S-1-16-12288
falsepositives:
    - Unknown
level: high
tags:
    - attack.privilege-escalation
    - attack.t1548.002
customer: 'demo'
