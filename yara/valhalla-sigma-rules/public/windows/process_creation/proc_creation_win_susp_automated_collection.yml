title: Automated Collection Command Prompt
id: f576a613-2392-4067-9d1a-9345fb58d8d1
status: test
description: Once established within a system or network, an adversary may use automated techniques for collecting internal data.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1119/T1119.md
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1552.001/T1552.001.md
date: "2021-07-28"
modified: "2022-11-11"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: selection_ext and 1 of selection_other_*
    selection_ext:
        CommandLine|contains:
            - .doc
            - .docx
            - .xls
            - .xlsx
            - .ppt
            - .pptx
            - .rtf
            - .pdf
            - .txt
    selection_other_dir:
        CommandLine|contains|all:
            - 'dir '
            - ' /b '
            - ' /s '
    selection_other_findstr:
        CommandLine|contains:
            - ' /e '
            - ' /si '
        OriginalFileName: FINDSTR.EXE
falsepositives:
    - Unknown
level: medium
tags:
    - attack.collection
    - attack.t1119
    - attack.credential-access
    - attack.t1552.001
customer: 'demo'
regression_tests_path: regression_data/rules/windows/process_creation/proc_creation_win_susp_automated_collection/info.yml
