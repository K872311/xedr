title: Suspicious Process By Web Server Process
id: 8202070f-edeb-4d31-a010-a26c72ac5600
status: test
description: |
    Detects potentially suspicious processes being spawned by a web server process which could be the result of a successfully placed web shell or exploitation
references:
    - https://media.defense.gov/2020/Jun/09/2002313081/-1/-1/0/CSI-DETECT-AND-PREVENT-WEB-SHELL-MALWARE-20200422.PDF
date: "2019-01-16"
modified: "2024-11-26"
author: Thomas Patzke, Florian Roth (Nextron Systems), Zach Stanford @svch0st, Tim Shelton, Nasreddine Bencherchali (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: process_creation
    product: windows
detection:
    condition: 1 of selection_webserver_* and selection_anomaly_children and not 1 of filter_main_*
    filter_main_fp_1:
        CommandLine|endswith: Windows\system32\cmd.exe /c C:\ManageEngine\ADManager "Plus\ES\bin\elasticsearch.bat -Enode.name=RMP-NODE1 -pelasticsearch-pid.txt
        ParentImage|endswith: \java.exe
    filter_main_fp_2:
        CommandLine|contains|all:
            - sc query
            - ADManager Plus
        ParentImage|endswith: \java.exe
    selection_anomaly_children:
        Image|endswith:
            - \arp.exe
            - \at.exe
            - \bash.exe
            - \bitsadmin.exe
            - \certutil.exe
            - \cmd.exe
            - \cscript.exe
            - \dsget.exe
            - \hostname.exe
            - \nbtstat.exe
            - \net.exe
            - \net1.exe
            - \netdom.exe
            - \netsh.exe
            - \nltest.exe
            - \ntdsutil.exe
            - \powershell_ise.exe
            - \powershell.exe
            - \pwsh.exe
            - \qprocess.exe
            - \query.exe
            - \qwinsta.exe
            - \reg.exe
            - \rundll32.exe
            - \sc.exe
            - \sh.exe
            - \wmic.exe
            - \wscript.exe
            - \wusa.exe
    selection_webserver_characteristics_tomcat1:
        ParentImage|contains:
            - -tomcat-
            - \tomcat
        ParentImage|endswith:
            - \java.exe
            - \javaw.exe
    selection_webserver_characteristics_tomcat2:
        ParentCommandLine|contains:
            - CATALINA_HOME
            - catalina.home
            - catalina.jar
        ParentImage|endswith:
            - \java.exe
            - \javaw.exe
    selection_webserver_image:
        ParentImage|endswith:
            - \caddy.exe
            - \httpd.exe
            - \nginx.exe
            - \php-cgi.exe
            - \php.exe
            - \tomcat.exe
            - \UMWorkerProcess.exe
            - \w3wp.exe
            - \ws_TomcatService.exe
falsepositives:
    - Particular web applications may spawn a shell process legitimately
level: high
tags:
    - attack.persistence
    - attack.initial-access
    - attack.t1505.003
    - attack.t1190
customer: 'demo'
