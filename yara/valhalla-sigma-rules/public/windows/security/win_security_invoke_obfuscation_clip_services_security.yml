logsource:
    product: windows
    service: security
    definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
detection:
    condition: selection
    selection:
        EventID: "4697"
        ServiceFileName|contains|all:
            - cmd
            - '&&'
            - 'clipboard]::'
falsepositives:
    - Unknown
level: high
