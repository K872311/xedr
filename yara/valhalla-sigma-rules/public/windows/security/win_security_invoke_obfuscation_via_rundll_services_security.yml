logsource:
    product: windows
    service: security
    definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
detection:
    condition: selection
    selection:
        EventID: "4697"
        ServiceFileName|contains|all:
            - rundll32.exe
            - shell32.dll
            - shellexec_rundll
            - powershell
falsepositives:
    - Unknown
level: medium
