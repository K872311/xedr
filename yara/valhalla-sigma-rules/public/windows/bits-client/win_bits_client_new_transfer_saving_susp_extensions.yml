title: BITS Transfer Job Downloading File Potential Suspicious Extension
id: b85e5894-9b19-4d86-8c87-a2f3b81f0521
status: test
description: Detects new BITS transfer job saving local files with potential suspicious extensions
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/f339e7da7d05f6057fdfcdd3742bfcf365fee2a9/atomics/T1197/T1197.md
date: "2022-03-01"
modified: "2023-03-27"
author: frack113
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    product: windows
    service: bits-client
detection:
    condition: selection and not 1 of filter_optional_*
    filter_optional_generic:
        LocalName|contains: \AppData\
        RemoteName|contains: .com
    selection:
        EventID: "16403"
        LocalName|endswith:
            - .bat
            - .dll
            - .exe
            - .hta
            - .ps1
            - .psd1
            - .sh
            - .vbe
            - .vbs
falsepositives:
    - While the file extensions in question can be suspicious at times. It's best to add filters according to your environment to avoid large amount false positives
level: medium
tags:
    - attack.persistence
    - attack.execution
    - attack.stealth
    - attack.t1197
customer: 'demo'
regression_tests_path: regression_data/rules/windows/builtin/bits_client/win_bits_client_new_transfer_saving_susp_extensions/info.yml
