title: Antivirus - Relevant File Paths Alerts Signature
id: c9a88268-0047-4824-ba6e-4d81ce0b907c
status: test
description: |
    Detects an Antivirus alert in a highly relevant file path or with a relevant file name.
    This event must not be ignored just because the AV has blocked the malware but investigate, how it came there in the first place.
references:
    - https://www.nextron-systems.com/?s=antivirus
date: "2018-09-09"
modified: "2026-06-29"
author: Florian Roth (Nextron Systems), Arnim Rupp
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: antivirus
detection:
    condition: 1 of selection_*
    selection_ext:
        Filename|endswith:
            - .asax
            - .ashx
            - .asmx
            - .asp
            - .aspx
            - .bat
            - .cfm
            - .cgi
            - .chm
            - .cmd
            - .dat
            - .ear
            - .gif
            - .hta
            - .jpeg
            - .jpg
            - .jsp
            - .jspx
            - .lnk
            - .msc
            - .php
            - .pl
            - .png
            - .ps1
            - .psm1
            - .py
            - .pyc
            - .rb
            - .scf
            - .sct
            - .sh
            - .svg
            - .txt
            - .vbe
            - .vbs
            - .war
            - .wll
            - .wsf
            - .wsh
            - .xll
            - .xml
    selection_path:
        Filename|contains:
            - :\PerfLogs\
            - :\Temp\
            - :\Users\Default\
            - :\Users\Public\
            - :\Windows\
            - /www/
            - \inetpub\
            - \tsclient\
            - apache
            - nginx
            - tomcat
            - weblogic
falsepositives:
    - Unlikely
level: high
tags:
    - attack.resource-development
    - attack.t1588
customer: 'demo'
