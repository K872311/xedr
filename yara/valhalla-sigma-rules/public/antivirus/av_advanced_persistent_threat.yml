title: Antivirus - APT Malware Signature
id: 101a1877-2cf4-474d-abfd-7f6ac4788d1a
status: experimental
description: |
    Detects a highly relevant Antivirus alert that reports APT malware.
    This event must not be ignored just because the AV has blocked the malware but investigate, how it came there in the first place.
references:
    - https://www.nextron-systems.com/?s=antivirus
date: "2026-06-15"
author: Arnim Rupp (Nextron Systems)
license: 'DRL 1.1 https://github.com/SigmaHQ/sigma/blob/master/LICENSE.Detection.Rules.md'
logsource:
    category: antivirus
detection:
    condition: selection
    selection:
        - Signature|re:
            - APT\d
            - ATK\d
            - UNC\d
            - UAC\d
        - Signature|contains:
            - '[APT]'
            - APT_
            - APT-
            - BackOrder
            - BlindingCan
            - Blizzard
            - Chollima
            - Cleaver
            - Cobra
            - DarkHotel
            - Dragon
            - DTrack
            - Equation
            - GiftedCrook
            - GraphSteel
            - GreyEnergy
            - GEnergy
            - GrimPlant
            - Hydra
            - Jackal
            - Kitten
            - Kimsuky
            - Lazar
            - LightRail
            - Lotus
            - Luminous
            - LumiMoth
            - Nimbus
            - Manticore
            - MiniBike
            - MiniBrowse
            - MiniBus
            - MiniFast
            - MiniJuke
            - MiniUpdate
            - MuddyWater
            - NukeSped
            - OilRig
            - Panda
